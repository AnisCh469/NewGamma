# ============================================================================
# nginx.conf - serveur de fichiers statiques + reverse proxy (frontend GAMMA3)
# ============================================================================
# Rôle : (1) servir l'application Angular compilée, (2) transmettre les appels
# API du navigateur vers le conteneur backend Spring Boot, pour que le
# frontend n'ait jamais besoin de connaître l'adresse réseau réelle du
# backend (voir gamma3-frontend/Dockerfile et src/environments/environment.prod.ts).
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular utilise le routage côté client (Router). Toute URL qui ne
    # correspond à aucun fichier statique doit donc retomber sur index.html
    # pour laisser le routeur Angular décider quelle page afficher (sinon
    # Nginx renverrait une 404 sur un simple rafraîchissement de page, ex:
    # /catalogue/123).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy vers le backend Spring Boot. "backend" est le nom du
    # service défini dans docker-compose.prod.yml : Docker résout ce nom en
    # adresse IP interne via son DNS embarqué, aucune configuration manuelle
    # n'est nécessaire.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # Fichiers déjà téléversés (photos/documents des articles).
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
    }
}
