<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-circle">
        <i class="pi pi-shield"></i>
      </div>
      <h2>GAMMA 3</h2>
      <p class="subtitle">Marine Nationale Tunisienne</p>
    </div>

    <form *ngIf="!show2faForm" (ngSubmit)="onLogin()" #loginForm="ngForm" class="login-form">
      <div class="p-fluid">
        <div class="field mb-4">
          <label for="matricule" class="block text-900 font-medium mb-2">Matricule</label>
          <span class="p-input-icon-left w-full">
            <i class="pi pi-user"></i>
            <input
              id="matricule"
              type="text"
              pInputText
              [(ngModel)]="matricule"
              name="matricule"
              placeholder="Saisissez votre matricule"
              required
              class="w-full"
            />
          </span>
        </div>

        <div class="field mb-4">
          <label for="password" class="block text-900 font-medium mb-2">Mot de passe</label>
          <span class="p-input-icon-left w-full">
            <i class="pi pi-lock"></i>
            <input
              id="password"
              type="password"
              pInputText
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              required
              class="w-full"
            />
          </span>
        </div>

        <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="mb-4 w-full"></p-message>

        <button
          pButton
          pRipple
          label="Connexion"
          icon="pi pi-sign-in"
          class="w-full mt-2 login-btn"
          [loading]="isLoading"
          type="submit"
          [disabled]="!loginForm.form.valid"
        ></button>
      </div>
    </form>

    <form *ngIf="show2faForm" (ngSubmit)="onVerify2Fa()" #verifyForm="ngForm" class="login-form">
      <div class="p-fluid">
        <div class="field mb-4">
          <label for="code2fa" class="block text-slate-800 font-bold mb-2 text-center text-xs uppercase tracking-widest text-[10px]">Double Facteur (2FA) Requis</label>
          <span class="p-input-icon-left w-full">
            <i class="pi pi-key"></i>
            <input
              id="code2fa"
              type="text"
              pInputText
              [(ngModel)]="code2fa"
              name="code2fa"
              placeholder="Code à 6 chiffres"
              required
              maxlength="6"
              class="w-full text-center font-mono font-bold tracking-[0.2em] text-lg py-2"
              autofocus
            />
          </span>
          <p class="text-[10px] text-slate-400 mt-2 text-center leading-normal">Saisissez le code temporaire à 6 chiffres fourni par votre application d'authentification.</p>
        </div>

        <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="mb-4 w-full"></p-message>

        <div class="flex gap-2 mt-2">
          <button
            pButton
            type="button"
            label="Retour"
            icon="pi pi-arrow-left"
            class="p-button-outlined p-button-secondary p-button-sm w-1/3"
            (click)="show2faForm = false; code2fa = ''"
          ></button>
          <button
            pButton
            label="Valider"
            icon="pi pi-check"
            class="p-button-primary p-button-sm w-2/3"
            [loading]="isLoading"
            type="submit"
            [disabled]="!verifyForm.form.valid"
          ></button>
        </div>
      </div>
    </form>
    
    <div class="login-footer">
      <p>Accès restreint. Tout accès non autorisé est passible de sanctions militaires.</p>
    </div>
  </div>
</div>
