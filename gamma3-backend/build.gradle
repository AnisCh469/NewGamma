plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'tn.defense.gamma3'
version = '0.0.1-SNAPSHOT'
description = 'Gamma 3 Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2'

	// Migrations de schéma versionnées (remplace progressivement `ddl-auto: update` — voir
	// docs/DATABASE_ARCHITECTURE.md §10). Flyway s'exécute au démarrage AVANT Hibernate.
	//  - spring-boot-flyway : Spring Boot 4.0 a sorti l'auto-configuration Flyway de
	//    spring-boot-autoconfigure vers ce module dédié — sans lui, Flyway est ignoré au boot.
	//  - flyway-database-postgresql : depuis Flyway 10, le support PostgreSQL est un module à part.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'com.microsoft.sqlserver:mssql-jdbc'
	
	// JasperReports Engine & Functions for PDF/Excel Exports (registres analytiques :
	// inventaire, mouvements, consommation — voir ReportController)
	implementation 'net.sf.jasperreports:jasperreports:6.21.3'
	implementation 'net.sf.jasperreports:jasperreports-functions:6.21.3'
	implementation 'org.apache.poi:poi:5.2.5'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'

	// Documents officiels (bon de sortie, bon d'entrée, PV réforme, facture, fiches,
	// étiquettes) : modèles HTML/CSS Thymeleaf -> PDF via openhtmltopdf. Voir
	// tn.defense.gamma3.document.* et docs/AUDIT_IMPRESSION.md.
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.28'
	implementation 'io.github.openhtmltopdf:openhtmltopdf-slf4j:1.1.28'
	// jsoup : nettoie le HTML5 produit par Thymeleaf en XHTML strict attendu par openhtmltopdf
	implementation 'org.jsoup:jsoup:1.18.1'
	// Génération des codes QR / code-barres imprimés sur les documents et étiquettes
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'
	
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

